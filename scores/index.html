<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Scoreline</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="title-row">
      <h1 id="view-title">My Teams</h1>
      <span id="live-indicator" class="live-indicator" hidden><span class="dot"></span>Live</span>
      <span class="spacer"></span>
      <button id="install-btn" class="pill-btn" hidden>Install</button>
      <button id="alerts-btn" class="bell-btn" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg>
      </button>
      <button id="teams-btn" class="pill-btn">Teams</button>
    </div>
    <nav id="league-nav" class="league-nav" aria-label="Leagues"></nav>
    <div id="toolbar" class="toolbar" hidden></div>
  </header>

  <main>
    <section id="games" class="games" aria-live="polite"></section>
    <div id="empty-state" class="empty-state" hidden></div>
    <p id="status-line" class="status-line"></p>
    <section id="panel" class="panel" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="scores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M12 5v14M7 10v4M17 10v4" /></svg>
      <span>Scores</span>
    </button>
    <button class="tab" data-tab="standings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Standings</span>
    </button>
    <button class="tab" data-tab="videos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" /><path d="m10 9 5 3-5 3z" /></svg>
      <span>Highlights</span>
    </button>
    <button class="tab" data-tab="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12v16H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1ZM17 8h2a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3" /></svg>
      <span>News</span>
    </button>
  </nav>

  <dialog id="game-dialog" class="sheet game-sheet">
    <div class="sheet-head">
      <button id="prev-game" class="icon-btn" aria-label="Previous game">&#8249;</button>
      <span id="game-league" class="sheet-label"></span>
      <button id="next-game" class="icon-btn" aria-label="Next game">&#8250;</button>
      <span class="spacer"></span>
      <button id="share-game" class="icon-btn" aria-label="Share score">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M6 11H5v10h14V11h-1" /></svg>
      </button>
      <button id="close-game" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div id="game-detail" class="sheet-body"></div>
  </dialog>

  <dialog id="teams-dialog" class="sheet">
    <div class="sheet-head">
      <span class="sheet-title">Follow teams</span>
      <button id="close-teams" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div class="picker-controls">
      <nav id="picker-leagues" class="league-nav" aria-label="League"></nav>
      <input id="team-search" class="search" type="search" placeholder="Search teams" autocomplete="off" />
    </div>
    <div id="team-list" class="sheet-body team-list"></div>
  </dialog>

  <dialog id="video-dialog" class="sheet video-sheet">
    <div class="sheet-head">
      <span id="video-title" class="sheet-title"></span>
      <button id="close-video" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div class="video-frame"><iframe id="video-frame" title="Highlight video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <a id="video-link" class="video-link" href="#" target="_blank" rel="noopener">Open in YouTube</a>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
