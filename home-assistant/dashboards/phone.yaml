# Phone dashboard — separate dashboard, does not touch the existing one.
#
# Install: Settings → Dashboards → Add dashboard → "New dashboard from scratch"
#   Title: Phone   Icon: mdi:cellphone   URL: dashboard-phone
# Open it → ✏️ → ⋮ → Raw configuration editor → replace everything with this file.
#
# Custom cards used: custom:firemote-card (the only HACS frontend card installed).
# Everything else is a built-in card. Media/remote cards hide themselves while
# the device is unavailable (see audit R3), so the layout stays clean.

title: Phone
views:
  # ─────────────────────────────── HOME ───────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: person.caleb_greene
        name: Caleb
        show_name: true
        show_state: true
      - type: entity
        entity: person.destiny
        name: Destiny
        show_name: true
        show_state: true
      - type: entity
        entity: weather.forecast_home
        show_name: false
        state_content: [state, temperature]
      - type: entity
        entity: sensor.2022_gmc_terrain_2022_gmc_terrain_fuel_range_mi
        name: Terrain
        icon: mdi:car
        show_name: true
        tap_action:
          action: navigate
          navigation_path: /dashboard-phone/car
      - type: entity
        entity: alarm_control_panel.blink_outdoor_cameras
        show_name: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-phone/security
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Routines
            icon: mdi:play-circle-outline
          - type: tile
            entity: script.night_time_routine
            name: Goodnight
            icon: mdi:weather-night
            color: indigo
            vertical: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.night_time_routine
              confirmation:
                text: Run the night routine?
            grid_options: { columns: 4, rows: 2 }
          # Presses the button that runs the Morning Time automation (works any time)
          - type: button
            name: Morning
            icon: mdi:weather-sunny
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target: { entity_id: input_button.morning_time_button }
            grid_options: { columns: 4, rows: 2 }
          - type: button
            name: All off
            icon: mdi:power
            show_state: false
            tap_action:
              action: perform-action
              perform_action: google_assistant_sdk.send_text_command
              data: { command: Turn off everything }
              confirmation:
                text: Turn off everything?
            grid_options: { columns: 4, rows: 2 }

      - type: grid
        cards:
          - type: markdown
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: media_player.bedroom_speaker
                    state: unavailable
                  - condition: state
                    entity: binary_sensor.motion_sensor_motion
                    state: unavailable
                  - condition: state
                    entity: device_tracker.caleb_s_phone_2
                    state: unknown
            content: >-
              **Needs attention**
              {%- set checks = [
                ('media_player.bedroom_speaker', 'Bedroom speaker offline — alarms will ring Caleb’s phone instead'),
                ('binary_sensor.motion_sensor_motion', 'Hallway motion sensor offline'),
                ('device_tracker.caleb_s_phone_2', 'Caleb’s phone not reporting location'),
                ('remote.living_room_tv', 'Living Room TV remote offline'),
              ] %}
              {%- for e, msg in checks if states(e) in ['unavailable', 'unknown'] %}

              • {{ msg }}
              {%- endfor %}
              {%- set low = states.sensor
                  | selectattr('entity_id', 'search', 'battery_level')
                  | selectattr('state', 'is_number') | list %}
              {%- for s in low if s.state | int(100) < 20 %}

              • {{ s.name }}: {{ s.state }}%
              {%- endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Living Room
            icon: mdi:sofa
          - type: button
            name: All living room lights
            icon: mdi:lightbulb-group
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.toggle
              target: { area_id: living_room }
            grid_options: { columns: 12, rows: 1 }
          # Lamp is its own light (area Lamp Room), so the "All living room lights" button above and the lights below do not control it
          - type: tile
            entity: light.living_room_lamp
            name: Lamp
            icon: mdi:floor-lamp
            features: [{ type: light-brightness }]
            features_position: bottom
            grid_options: { columns: 12 }
          - type: tile
            entity: light.living_room_living_room_1
            name: Light 1
            features: [{ type: light-brightness }]
            features_position: bottom
            grid_options: { columns: 12 }
          - type: tile
            entity: light.living_room_living_room_2
            name: Light 2
            features: [{ type: light-brightness }]
            features_position: bottom
            grid_options: { columns: 12 }
          - type: tile
            entity: light.living_room_living_room_3
            name: Light 3
            features: [{ type: light-brightness }]
            features_position: bottom
            grid_options: { columns: 12 }

      - type: grid
        cards:
          - type: heading
            heading: Kitchen & Dining
            icon: mdi:silverware-fork-knife
          - type: tile
            entity: light.kitchen
            name: Kitchen
            features: [{ type: light-brightness }]
            features_position: bottom
          - type: tile
            entity: light.dining_room
            name: Dining
            features: [{ type: light-brightness }]
            features_position: bottom

      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
          # Wall switch that powers the two bulbs below (they show offline when it is off)
          - type: tile
            entity: light.bedroom_light_switch
            name: Light switch
          - type: tile
            entity: light.bedroom_light_1
            name: Light 1
          - type: tile
            entity: light.bedroom_light_2
            name: Light 2
          - type: tile
            entity: switch.fan
            name: Fan
            icon: mdi:fan
          - type: tile
            entity: switch.merkury_ww118_smart_plug_socket_1
            name: AC
            icon: mdi:air-conditioner

      - type: grid
        cards:
          - type: heading
            heading: Elsewhere
            icon: mdi:floor-plan
          - type: tile
            entity: light.basement_lights
            name: Basement
          - type: tile
            entity: light.office
            name: Office
          - type: tile
            entity: light.hallway_light
            name: Hallway

