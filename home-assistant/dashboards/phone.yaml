            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Hulu
            icon: mdi:alpha-h-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.living_room_tv }
              data: { activity: "https://www.hulu.com" }
            visibility:
              - { condition: state, entity: remote.living_room_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Max
            icon: mdi:alpha-m-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.living_room_tv }
              data: { activity: "https://play.max.com" }
            visibility:
              - { condition: state, entity: remote.living_room_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Spotify
            icon: mdi:spotify
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.living_room_tv }
              data: { activity: "spotify://" }
            visibility:
              - { condition: state, entity: remote.living_room_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: markdown
            content: Remote offline — Android TV Remote can’t reach the Streamer.
            visibility:
              - { condition: state, entity: remote.living_room_tv, state: unavailable }

      - type: grid
        cards:
          - type: heading
            heading: Bedroom TV
            icon: mdi:television-classic
          - type: media-control
            entity: media_player.bedroom_tv_3
            visibility:
              - { condition: state, entity: media_player.bedroom_tv_3, state_not: unavailable }
          - type: tile
            entity: script.netflix
            name: Open Stremio
            icon: mdi:play-box
            hide_state: true
            tap_action: { action: perform-action, perform_action: script.netflix }
          - type: button
            name: Open remote
            icon: mdi:remote-tv
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-phone/bedroom-remote
            grid_options: { columns: 12, rows: 1 }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
          - type: button
            name: Disney+
            icon: mdi:magic-staff
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.bedroom_tv }
              data: { activity: "https://www.disneyplus.com" }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Prime
            icon: mdi:filmstrip-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.bedroom_tv }
              data: { activity: "https://app.primevideo.com" }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Hulu
            icon: mdi:alpha-h-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.bedroom_tv }
              data: { activity: "https://www.hulu.com" }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Max
            icon: mdi:alpha-m-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.bedroom_tv }
              data: { activity: "https://play.max.com" }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: button
            name: Spotify
            icon: mdi:spotify
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.turn_on
              target: { entity_id: remote.bedroom_tv }
              data: { activity: "spotify://" }
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state_not: unavailable }
            grid_options: { columns: 3, rows: 1 }
          - type: markdown
            content: Remote offline — Android TV Remote can’t reach the Chromecast.
            visibility:
              - { condition: state, entity: remote.bedroom_tv, state: unavailable }

      - type: grid
        cards:
          - type: heading
            heading: Xbox
            icon: mdi:microsoft-xbox
          - type: tile
            entity: media_player.xbox
            name: Xbox Series S
            vertical: false
          - type: tile
            entity: remote.xbox_remote
            name: Power
            icon: mdi:power

  # ───────────────────────────── SECURITY ─────────────────────────────
  - title: Security
    path: security
    icon: mdi:cctv
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Blink
            icon: mdi:shield-home
          - type: tile
            entity: alarm_control_panel.blink_outdoor_cameras
            name: Outdoor
            features: [{ type: alarm-modes, modes: [armed_away, disarmed] }]
            features_position: bottom
            grid_options: { columns: 12 }
          - type: tile
            entity: script.turn_on_cameras
            name: Cameras on
            icon: mdi:cctv
            color: red
            vertical: true
            hide_state: true
            tap_action: { action: perform-action, perform_action: script.turn_on_cameras }
          - type: tile
            entity: script.turn_off_cameras
            name: Cameras off
            icon: mdi:cctv-off
            vertical: true
            hide_state: true
            tap_action: { action: perform-action, perform_action: script.turn_off_cameras }

      - type: grid
        cards:
          - type: heading
            heading: Outside
          - type: picture-entity
            entity: camera.porch
            name: Porch
            camera_view: auto
          - type: picture-entity
            entity: camera.front_door
            name: Back Yard
            camera_view: auto
          - type: picture-entity
            entity: camera.garage
            name: Garage
            camera_view: auto

      - type: grid
        cards:
          - type: heading
            heading: Inside
          - type: picture-entity
            entity: camera.living_room
            name: Living Room
            camera_view: auto
            grid_options: { columns: 6 }
          - type: picture-entity
            entity: camera.kitchen
            name: Kitchen
            camera_view: auto
            grid_options: { columns: 6 }
          - type: picture-entity
            entity: camera.dining_room
            name: Dog Room
            camera_view: auto
            grid_options: { columns: 6 }

      - type: grid
        cards:
          - type: heading
            heading: Motion detection
          - { type: tile, entity: switch.porch_camera_motion_detection, name: Porch }
          - { type: tile, entity: switch.front_door_camera_motion_detection, name: Back Yard }
          - { type: tile, entity: switch.garage_camera_motion_detection, name: Garage }
          - { type: tile, entity: switch.living_room_camera_motion_detection, name: Living Rm }
          - { type: tile, entity: switch.kitchen_camera_motion_detection, name: Kitchen }
          - { type: tile, entity: switch.dining_room_camera_motion_detection, name: Dog Room }

  # ────────────────────────────── ALARM ───────────────────────────────
  - title: Car
    path: car
    icon: mdi:car
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: GMC Terrain
            icon: mdi:car-estate
          - type: markdown
            content: >-
              {%- set aa = is_state('binary_sensor.caleb_s_phone_android_auto_2', 'on') %}
              {%- set bt = 'myGMC' in (state_attr('sensor.caleb_s_phone_bluetooth_connection_2', 'connected_paired_devices') or []) | join(' ') %}
              {%- set spd = states('sensor.caleb_s_phone_car_speed_2') %}
              ## {{ '🚗 Driving' if (aa or bt) else '🅿️ Parked' ~ (' at home' if is_state('device_tracker.2022_gmc_terrain', 'home') else '') }}
              {%- if (aa or bt) and spd | is_number %}

              **{{ spd | float | round(0) | int }} mph**
              {%- endif %}

              {{ '{:,}'.format(states('sensor.2022_gmc_terrain_2022_gmc_terrain_odo_read_mi') | float(0) | round(0) | int) }} mi · {{ states('sensor.2022_gmc_terrain_2022_gmc_terrain_average_fuel_economy_mpg') }} mpg average · updated {{ relative_time(as_datetime(states('sensor.2022_gmc_terrain_command_status_monitor_sensors_2022_gmc_terrain_command_status_monitor_sensors_polling_status_timestamp'))) }} ago
          - type: markdown
            content: >-
              {%- set p = 'sensor.2022_gmc_terrain_command_status_monitor_sensors_2022_gmc_terrain_command_status_monitor_sensors_command_' %}
              {%- set cmds = [('startvehicle', 'Start'), ('cancelstartvehicle', 'Stop start'), ('lockdoor', 'Lock'), ('unlockdoor', 'Unlock'), ('flashlights', 'Flash'), ('alerthonk', 'Honk'), ('cancelalert', 'Stop alert'), ('getlocation', 'Locate')] %}
              {%- set ns = namespace(best=none, label='', status='', st=none, cs=none) %}
              {%- for key, label in cmds %}
                {%- set t = states(p ~ key ~ '_status_monitor_timestamp') %}
                {%- if t not in ['unknown', 'unavailable', 'none', ''] %}
                  {%- set when = as_datetime(t) %}
                  {%- if key == 'startvehicle' %}{%- set ns.st = when %}{%- endif %}
                  {%- if key == 'cancelstartvehicle' %}{%- set ns.cs = when %}{%- endif %}
                  {%- if ns.best is none or when > ns.best %}
                    {%- set ns.best = when %}
                    {%- set ns.label = label %}
                    {%- set ns.status = states(p ~ key ~ '_status_monitor') %}
                  {%- endif %}
                {%- endif %}
              {%- endfor %}
              {%- if ns.st is not none and is_state(p ~ 'startvehicle_status_monitor', 'Completed Successfully') and (now() - ns.st).total_seconds() < 900 and (ns.cs is none or ns.cs < ns.st) %}
              {%- set mins = ((now() - ns.st).total_seconds() / 60) | int %}
              🟢 **Remote start sent {{ mins }} min ago** · about {{ 15 - mins }} min left (estimate — the car itself has the final say){{ '\n\n' }}
              {% endif -%}
              {%- if ns.best is not none %}
              Last command: **{{ ns.label }}** — {{ ns.status }}, {{ relative_time(ns.best) }} ago
              {%- else %}
              No commands sent yet.
              {%- endif %}
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_fuel_level
            name: Fuel
            icon: mdi:gas-station
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_fuel_range_mi
            name: Range
            icon: mdi:map-marker-distance
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.terrain_oil_life
            name: Oil life
            icon: mdi:oil
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_trip_a_odo_mi
            name: Trip A
            icon: mdi:counter
            grid_options: { columns: 6 }

      - type: grid
        cards:
          - type: heading
            heading: Controls
            icon: mdi:car-key
          - type: button
            name: Lock
            icon: mdi:car-door-lock
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_lockdoor }
              confirmation:
                text: Lock the Terrain?
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Unlock
            icon: mdi:car-door
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_unlockdoor }
              confirmation:
                text: Unlock the Terrain?
            grid_options: { columns: 3, rows: 2 }
          # Lights up green for 15 min after a successful remote start (estimate from OnStar's command status)
          - type: tile
            entity: binary_sensor.terrain_remote_started
            name: Start
            icon: mdi:car-key
            color: green
            vertical: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_start }
              confirmation:
                text: Remote start the Terrain?
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Stop
            icon: mdi:engine-off
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_cancelstart }
              confirmation:
                text: Stop the remote start?
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Flash
            icon: mdi:car-light-high
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_flashlights }
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Honk
            icon: mdi:bullhorn
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_alerthonk }
              confirmation:
                text: Honk the horn and flash the lights?
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Stop alert
            icon: mdi:volume-off
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_cancelalert }
            grid_options: { columns: 3, rows: 2 }
          - type: button
            name: Locate
            icon: mdi:crosshairs-gps
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.2022_gmc_terrain_2022_gmc_terrain_command_getlocation }
            grid_options: { columns: 3, rows: 2 }
          - type: markdown
            content: >-
              Commands go through OnStar and take 30–60 seconds to reach the car.

      - type: grid
        cards:
          - type: heading
            heading: Tires
            icon: mdi:car-tire-alert
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_left_front_tire_pressure_psi
            name: Front left
            icon: mdi:tire
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_right_front_tire_pressure_psi
            name: Front right
            icon: mdi:tire
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_left_rear_tire_pressure_psi
            name: Rear left
            icon: mdi:tire
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.2022_gmc_terrain_2022_gmc_terrain_right_rear_tire_pressure_psi
            name: Rear right
            icon: mdi:tire
            grid_options: { columns: 6 }
          - type: markdown
            content: >-
              Recommended: **{{ states('sensor.2022_gmc_terrain_2022_gmc_terrain_front_placard_psi') }} psi** front ·
              **{{ states('sensor.2022_gmc_terrain_2022_gmc_terrain_rear_placard_psi') }} psi** rear

      - type: grid
        cards:
          - type: heading
            heading: Health
            icon: mdi:car-wrench
          - type: markdown
            content: >-
              {%- set items = [
                ('Oil life', states('sensor.2022_gmc_terrain_2022_gmc_terrain_eol_read') | float(0) | round(0) | int ~ '%', states('sensor.2022_gmc_terrain_2022_gmc_terrain_engine_oil_life_status_color')),
                ('Air filter', states('sensor.2022_gmc_terrain_2022_gmc_terrain_engine_air_filter_life_rmaining_hmi') ~ '%', states('sensor.2022_gmc_terrain_2022_gmc_terrain_engine_air_filter_status_color')),
                ('Battery', states('sensor.2022_gmc_terrain_2022_gmc_terrain_battery_state_of_charge_critically_low_status'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_battery_state_of_charge_critically_low_status_color')),
                ('Brake fluid', states('sensor.2022_gmc_terrain_2022_gmc_terrain_brake_fluid_low_status'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_brake_fluid_low_status_color')),
                ('Washer fluid', states('sensor.2022_gmc_terrain_2022_gmc_terrain_washer_fluid_low_status'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_washer_fluid_low_status_color')),
                ('Tires', states('sensor.2022_gmc_terrain_2022_gmc_terrain_tire_pressure_status'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_tire_pressure_status_color')),
              ] %}
              {%- set dot = {'GREEN': '🟢', 'YELLOW': '🟡', 'RED': '🔴'} %}
              {%- for name, val, col in items %}

              {{ dot.get(col, '⚪') }} **{{ name }}:** {{ val | title }}
              {%- endfor %}

              {{ '🟢' if states('sensor.2022_gmc_terrain_2022_gmc_terrain_vehicle_recalls') | int(0) == 0 else '🔴' }} **Recalls:** {{ states('sensor.2022_gmc_terrain_2022_gmc_terrain_vehicle_recalls') }}

              Airbags, ABS, engine, emissions, StabiliTrak: {{ 'all OK' if [states('sensor.2022_gmc_terrain_2022_gmc_terrain_air_bag_system'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_antilock_braking_system'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_engine_and_transmission_system'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_emissions_system'), states('sensor.2022_gmc_terrain_2022_gmc_terrain_stabilitrak_r_stability_control_system')] | select('ne', 'NO_ACTION_REQUIRED') | list | length == 0 else '⚠️ check the OnStar app' }}

      - type: grid
        cards:
          - type: heading
            heading: Where it is
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: device_tracker.2022_gmc_terrain
                name: Terrain
              - entity: device_tracker.caleb_s_phone_2
                name: Caleb
            hours_to_show: 24
            default_zoom: 15
            grid_options: { columns: 12, rows: 6 }

