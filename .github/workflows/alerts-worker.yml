name: Deploy alerts server

# Deploys the Scoreline alerts server to Cloudflare whenever it changes.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    paths:
      - "alerts-worker/**"
      - ".github/workflows/alerts-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerts-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.145.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy the alerts server."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the database if needed
        if: steps.secrets.outputs.ready == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "scoreline-alerts") | (.uuid // .id)' | head -n1)
          if [ -z "$id" ]; then
            $WRANGLER d1 create scoreline-alerts
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "scoreline-alerts") | (.uuid // .id)' | head -n1)
          fi
          if [ -z "$id" ]; then echo "::error::Couldn't create or find the scoreline-alerts database."; exit 1; fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: Set up the tables
        if: steps.secrets.outputs.ready == 'true'
        run: $WRANGLER d1 execute scoreline-alerts --remote --file schema.sql --yes

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: $WRANGLER deploy

      # Calls the live server and prints the shape of what ESPN and YouTube send
      # back, so data problems show up in the deploy log.
      - name: Check the live server
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          SERVER: https://scoreline-alerts.cjmaster556.workers.dev
        run: |
          sleep 5
          get() { curl -sS --max-time 20 "$SERVER$1"; }
          echo "== health"; get /
          for lg in football/nfl basketball/nba baseball/mlb hockey/nhl basketball/wnba; do
            echo "== standings $lg (level 3)"
            get "/espn/apis/v2/sports/$lg/standings?level=3" | jq -c '{name, groups: [.children[]? | {name, abbreviation, n: (.standings.entries | length), kids: [.children[]? | {name, n: (.standings.entries | length)}]}]}' | cut -c1-900
            get "/espn/apis/v2/sports/$lg/standings?level=3" | jq -c '[.. | objects | select(.standings?.entries?) | .standings.entries[0]][0] | {team: .team.displayName, logo: .team.logos[0].href, stats: [.stats[] | "\(.name)|\(.abbreviation)|\(.displayValue)"]}' | cut -c1-1500
          done
          echo "== standings nfl (default level)"
          get "/espn/apis/v2/sports/football/nfl/standings" | jq -c '{groups: [.children[]? | {name, n: (.standings.entries | length), kids: [.children[]? | .name]}]}'
          echo "== cfb rankings"
          get "/espn/apis/site/v2/sports/football/college-football/rankings" | jq -c '{polls: [.rankings[]? | .name], first: (.rankings[0].ranks[0] | {current, previous, points, recordSummary, team: .team.nickname, teamKeys: (.team | keys), keys: keys})}'
          echo "== nfl news"
          get "/espn/apis/site/v2/sports/football/nfl/news?limit=20" | jq -c '{n: (.articles | length), types: [.articles[].type] | unique, first: (.articles[0] | {headline, type, published, img: .images[0].url, web: .links.web.href, keys: keys}), media: ([.articles[] | select(.type == "Media")][0] | if . then {headline, keys: keys, links: .links} else null end)}' | cut -c1-2500
          echo "== team news (BUF)"
          get "/espn/apis/site/v2/sports/football/nfl/news?team=2&limit=5" | jq -c '[.articles[]?.headline]'
          for lg in nfl nba mlb nhl wnba cfb; do
            echo "== videos $lg"
            get "/videos?league=$lg" | jq -c '{channel, n: (.items | length), first: [.items[0:4][] | {title, published}]}' | cut -c1-900
          done
          echo "== game videos (ESPN summary)"
          for lg in football/nfl football/college-football hockey/nhl baseball/mlb basketball/nba; do
            id=$(curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/$lg/scoreboard" | jq -r '[.events[]? | select(.status.type.state != "pre")][0].id // empty')
            echo "-- $lg event $id"
            [ -z "$id" ] && continue
            curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/$lg/summary?event=$id" | jq -c '{n: ((.videos // []) | length), first: ((.videos // [])[0] // {} | {headline, description, duration, thumbnail, lastModified, keys: keys, links: .links})}' | cut -c1-3000
          done
          echo "== highlight sources per live NFL game"
          board=$(curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard")
          news=$(get "/espn/apis/site/v2/sports/football/nfl/news?limit=50")
          yt=$(get "/videos?league=nfl")
          echo "$board" | jq -r '.events[] | select(.status.type.state != "pre") | [.id, .shortName, .status.type.shortDetail, (.competitions[0].competitors | map(.team.shortDisplayName) | join("|"))] | @tsv' | while IFS=$'\t' read -r id name status teams; do
            espn=$(curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$id" | jq '(.videos // []) | length')
            ytn=$(echo "$yt" | jq --arg t "$teams" '[.items[] | select(.title | test($t; "i"))] | length')
            nn=$(echo "$news" | jq --arg t "$teams" '[.articles[] | select(.type == "Media" and (.headline | test($t; "i")))] | length')
            echo "$name ($status): espn clips=$espn, youtube=$ytn, espn video stories=$nn"
          done
          echo "-- newest NFL YouTube video:"; echo "$yt" | jq -r '.items | [.[0].published, .[-1].published] | "newest \(.[0]), oldest \(.[1])"'
          echo "== how fresh is ESPN's data? (live NFL game, normal vs cache-busting request)"
          for i in 1 2 3; do
            for url in "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?_=$(date +%s%N)"; do
              h=$(curl -sS -D - -o /tmp/sb.json --max-time 20 "$url" | tr -d '\r' | grep -iE '^(cache-control|age|x-cache|last-modified):' | tr '\n' ' ')
              clock=$(jq -r '[.events[] | select(.status.type.state == "in")][0] | "\(.shortName) \(.status.displayClock) Q\(.status.period)"' /tmp/sb.json)
              echo "$(date +%T) $( [[ $url == *"_="* ]] && echo busted || echo normal ) | $clock | $h"
            done
            sleep 4
          done
          echo "== clock research: ESPN play wallclock vs now (live NFL games)"
          curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" | jq -r '.events[] | select(.status.type.state == "in") | .id' | head -3 | while read -r id; do
            curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$id" > /tmp/s.json
            echo "now $(date -u +%FT%TZ) | header clock: $(jq -c '.header.competitions[0].status | {displayClock, clock, period, keys: (.|keys)}' /tmp/s.json)"
            jq -c '[.drives.current.plays // [] | .[-3:][] | {text: .text[0:60], clock: .clock.displayValue, wallclock, modified, keys: (.|keys)}]' /tmp/s.json | cut -c1-1500
            jq -c '[.plays // [] | .[-2:][] | {text: .text[0:60], clock: .clock.displayValue, wallclock}]' /tmp/s.json | cut -c1-600
          done
          echo "== clock research: NHL api-web"
          curl -sS -D /tmp/nhl.h --max-time 20 "https://api-web.nhle.com/v1/score/now" | jq -c '[.games[]? | {away: .awayTeam.abbrev, home: .homeTeam.abbrev, state: .gameState, clock, period: .periodDescriptor}] | .[0:4]' | cut -c1-1500
          echo "NHL CORS/cache: $(grep -iE '^(access-control-allow-origin|cache-control|age):' /tmp/nhl.h | tr -d '\r' | tr '\n' ' ')"
          echo "== clock research: NBA cdn"
          curl -sS -D /tmp/nba.h --max-time 20 "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json" | jq -c '{date: .scoreboard.gameDate, n: (.scoreboard.games | length), first: (.scoreboard.games[0] // {} | {gameStatusText, period, gameClock, keys: (.|keys)})}' | cut -c1-900
          echo "NBA CORS/cache: $(grep -iE '^(access-control-allow-origin|cache-control|age):' /tmp/nba.h | tr -d '\r' | tr '\n' ' ')"
          echo "== league clock feeds through the server"
          curl -sS -D /tmp/n.h --max-time 20 "$SERVER/nhl/v1/score/now" > /tmp/n.json; echo "NHL status $(head -1 /tmp/n.h | tr -d '\r') age=$(grep -i '^x-data-age' /tmp/n.h | tr -d '\r')"
          jq -c '{keys: keys, games: [.games[]? | {id, gameState, startTimeUTC, away: .awayTeam.abbrev, home: .homeTeam.abbrev, as: .awayTeam.score, hs: .homeTeam.score, clock, period, periodDescriptor}] | .[0:6]}' /tmp/n.json | cut -c1-2500
          curl -sS -D /tmp/b.h --max-time 20 "$SERVER/nba/static/json/liveData/scoreboard/todaysScoreboard_00.json" > /tmp/b.json; echo "NBA status $(head -1 /tmp/b.h | tr -d '\r') age=$(grep -i '^x-data-age' /tmp/b.h | tr -d '\r')"
          jq -c '{date: .scoreboard.gameDate, n: (.scoreboard.games | length), games: [.scoreboard.games[0:3][] | {gameId, gameStatus, gameStatusText, period, gameClock, gameTimeUTC, home: .homeTeam.teamTricode, away: .awayTeam.teamTricode}]}' /tmp/b.json 2>/dev/null | cut -c1-1500 || head -c 300 /tmp/b.json
          echo "== team schedule / roster (BUF)"
          get "/espn/apis/site/v2/sports/football/nfl/teams/2/schedule" | jq -c '{keys: keys, n: (.events | length), team: (.team | {displayName, recordSummary, standingSummary, color, alternateColor}), e: (.events[0] | {id, date, name, week: .week.text, comp: (.competitions[0] | {status: .status.type.state, competitors: [.competitors[] | {homeAway, abbr: .team.abbreviation, score, winner}]})})}' | cut -c1-1500
          get "/espn/apis/site/v2/sports/football/nfl/teams/2/roster" | jq -c '{keys: keys, groups: [.athletes[]? | {position, n: (.items | length), first: (.items[0] | {fullName, jersey, pos: .position.abbreviation, headshot: .headshot.href, age, experience: .experience.years})}]}' | cut -c1-1500
          get "/espn/apis/site/v2/sports/basketball/nba/teams/13/roster" | jq -c '{keys: keys, n: (.athletes | length), first: (.athletes[0] | {fullName, jersey, pos: .position.abbreviation, keys: keys})}' | cut -c1-900
          echo "== win probability (finished NFL game)"
          id=$(curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" | jq -r '[.events[] | select(.status.type.state == "post")][0].id')
          curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$id" | jq -c '{n: ((.winprobability // []) | length), first: (.winprobability[0] // {}), last: (.winprobability[-1] // {}), playKeys: ((.drives.previous[0].plays[0] // {}) | keys)}' | cut -c1-900
          echo "== playoffs view: season markers and late-September days"
          curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?seasontype=3&dates=202609&limit=300" | jq -c '[.events[] | .season] | group_by(.) | map({s: .[0], n: length})' | cut -c1-400
          for d in 20260929 20260930; do
            curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?seasontype=3&dates=$d&limit=300" | jq -c --arg d "$d" '{d: $d, n: (.events | length), games: [.events[] | {season: .season, note: .competitions[0].notes[0].headline, name: .shortName}]}' | cut -c1-700
          done
          echo "== ESPN app links on events (for the Watch button)"
          curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" | jq -c '[.events[0:2][] | {name: .shortName, links: [.links[]? | {rel, href}], compLinks: [.competitions[0].links[]? | {rel, href}], bc: .competitions[0].broadcasts, geo: .competitions[0].geoBroadcasts[0:2]}]' | cut -c1-3000
          curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" | jq -c '[.events[0:1][] | {name: .shortName, links: [.links[]? | {rel, href}]}]' | cut -c1-1500
          echo "== summary header (to open a game that isn't on the scoreboard)"
          curl -sS --max-time 20 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401872660" | jq -c '.header | {keys: keys, id, week, season, links: [.links[]? | {rel, href}][0:4], comp: (.competitions[0] | {keys: keys, date, status: .status.type, broadcasts, c0: (.competitors[0] | {keys: keys, team: (.team | {keys: keys, logos: .logos[0:1]}), score, record, winner, homeAway})})}' | cut -c1-3000
          echo "== phone reports (notification pictures)"
          curl -sS --max-time 20 "$SERVER/diag" | jq -c '.[0:8][]' | cut -c1-700
          echo "== dark-background logos"
          for u in nfl/500-dark/lar.png nfl/500-dark/buf.png nfl/500-dark/lv.png ncaa/500-dark/2483.png mlb/500-dark/nyy.png nhl/500-dark/bos.png nba/500-dark/lal.png wnba/500-dark/atl.png nfl/500-dark/zzz.png; do
            echo "$u $(curl -sS -o /dev/null -w '%{http_code} %{size_download}' "https://a.espncdn.com/i/teamlogos/$u")"
          done
          echo "== golf (PGA / LPGA)"
          for lg in pga lpga; do
            curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/golf/$lg/scoreboard" > /tmp/g.json
            echo "-- $lg scoreboard: $(jq -c '{keys: keys, leagues: [.leagues[]? | {name, abbreviation, season: .season.year, calendarN: (.calendar | length), cal0: (.calendar[0] | if type == "object" then {label, startDate, endDate, id} else . end)}], n: (.events | length)}' /tmp/g.json | cut -c1-700)"
            jq -c '.events[0] | {keys: keys, id, name, shortName, date, endDate, status, tournament: (.tournament // null), compKeys: (.competitions[0] | keys), comp: (.competitions[0] | {id, date, status, venue: .venue, broadcasts, purse, n: (.competitors | length)})}' /tmp/g.json | cut -c1-2500
            jq -c '.events[0].competitions[0].competitors[0:2][] | {keys: keys, id, order, sortOrder, status, score, athlete: (.athlete | {keys: keys, displayName, shortName, flag, headshot}), stats: .statistics[0:6], lsN: (.linescores | length), ls0: (.linescores[0] | {keys: keys, value, displayValue, period, holesN: (.linescores | length), hole0: .linescores[0]}), lsLast: (.linescores[-1] | {value, displayValue, period, holesN: (.linescores | length)})}' /tmp/g.json | cut -c1-3000
          done
          echo "-- golf by date (a past tournament)"
          cal=$(curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard" | jq -c '[.leagues[0].calendar[] | select((.endDate // "") < "2026-10-19")] | .[-2:]')
          echo "recent PGA tournaments: $cal" | cut -c1-500
          id=$(echo "$cal" | jq -r '.[-1].id'); sd=$(echo "$cal" | jq -r '.[-1].startDate' | cut -c1-10 | tr -d '-')
          for q in "dates=$sd" "event=$id" "dates=${sd:0:6}" "tournamentId=$id"; do
            echo "pga ?$q -> $(curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?$q" | jq -c '[.events[]? | {id, name, n: (.competitions[0].competitors | length)}]' | cut -c1-300)"
          done
          echo "lpga ?dates=20261016 -> $(curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/golf/lpga/scoreboard?dates=20261016" | jq -c '[.events[]? | {id, name, n: (.competitions[0].competitors | length)}]' | cut -c1-300)"
          echo "-- golf leaderboard (site.web)"
          curl -sS --max-time 30 "https://site.web.api.espn.com/apis/site/v2/sports/golf/leaderboard?league=pga" | jq -c '{keys: keys, ev: (.events[0] | {keys: keys, name, status: .status.type, comp: (.competitions[0] | {keys: keys, c0: (.competitors[0] | {keys: keys, status, score, stats: [.statistics[]? | {name, displayValue}][0:10]})})})}' | cut -c1-2500
          echo "-- golf news / standings"
          curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/golf/pga/news?limit=3" | jq -c '{n: (.articles | length), first: .articles[0].headline}'
          curl -sS --max-time 30 -o /dev/null -w "standings %{http_code}\n" "https://site.api.espn.com/apis/v2/sports/golf/pga/standings"
          curl -sS --max-time 30 "https://site.api.espn.com/apis/v2/sports/golf/pga/standings" | jq -c '{keys: keys, kids: [.children[]? | {name, n: (.standings.entries | length), e0: (.standings.entries[0] | {athlete: .athlete.displayName, team: .team.displayName, stats: [.stats[]? | {name, displayValue}][0:6]})}], direct: (.standings.entries[0:1] // null)}' 2>/dev/null | cut -c1-1500
          echo "== golf season standings (ESPN core)"
          for lg in pga lpga; do
            curl -sS --max-time 20 "https://sports.core.api.espn.com/v2/sports/golf/leagues/$lg/seasons/2026/types/2/standings/0" > /tmp/st.json
            echo "-- $lg: $(jq -c '{keys: keys, name, n: (.standings | length), e0: (.standings[0] | {keys: keys, athlete, records: [.records[]? | {name, displayValue, stats: [.stats[]? | {name, displayValue}][0:6]}][0:2]})}' /tmp/st.json | cut -c1-1500)"
          done
          echo "-- OWGR women? $(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://apiweb.owgr.com/api/owgr/rankings/getRankings?pageSize=2&pageNumber=1&gender=F')"
          echo "== logo proxy"; curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "$SERVER/logo?src=https://a.espncdn.com/i/teamlogos/nfl/500/buf.png"
