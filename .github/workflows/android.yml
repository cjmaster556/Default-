name: Build Android app

# Builds the Scoreline APK whenever the Android app changes, and posts it on the
# "android-latest" release so the newest one is always at the same download link.
on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/scoreline.apk"
      - name: Publish to the android-latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --target "$GITHUB_SHA" --title "Scoreline for Android" --notes "The newest Scoreline APK. Download scoreline.apk on your phone and open it to install or update."
          gh release upload android-latest scoreline.apk --clobber
          echo "Built version 1.0.$GITHUB_RUN_NUMBER"
