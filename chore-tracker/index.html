<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chore Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Chores</h1>
    <p id="summary" class="summary"></p>
  </header>

  <main>
    <section id="chore-list" class="chore-list" aria-live="polite"></section>
    <p id="empty-state" class="empty-state" hidden>No chores yet. Add one below to get started.</p>
  </main>

  <button id="add-btn" class="fab" aria-label="Add chore">+</button>

  <dialog id="add-dialog" class="add-dialog">
    <form id="add-form" method="dialog">
      <h2>New Chore</h2>

      <label for="chore-name">Name</label>
      <input id="chore-name" type="text" placeholder="e.g. Take out trash" required maxlength="60" />

      <label for="chore-frequency">Repeats</label>
      <select id="chore-frequency">
        <option value="1">Daily</option>
        <option value="7" selected>Weekly</option>
        <option value="14">Every 2 weeks</option>
        <option value="30">Monthly</option>
        <option value="custom">Custom (days)</option>
      </select>

      <div id="custom-days-wrap" class="custom-days-wrap" hidden>
        <label for="custom-days">Every N days</label>
        <input id="custom-days" type="number" min="1" max="365" value="3" />
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add Chore</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
